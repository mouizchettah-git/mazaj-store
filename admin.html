<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة التحكم | Mazaj Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Readex Pro', 'Outfit', sans-serif; overflow-x: hidden; transition: background-color 0.3s ease, color 0.3s ease; position: relative; }
    h1, h2, h3, .luxury-title { font-family: 'Outfit', 'Readex Pro', sans-serif; }
    
    #particles-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 0;
    }

    .glass-card { 
      background: rgba(15, 23, 42, 0.85); 
      backdrop-filter: blur(16px); 
      border: 1px solid rgba(255, 255, 255, 0.1); 
      transition: background-color 0.3s ease, border-color 0.3s ease, box-shadow 0.3s ease; 
      position: relative;
    }
    .light .glass-card { 
      background: rgba(255, 255, 255, 0.92); 
      backdrop-filter: blur(16px); 
      border: 1px solid rgba(217, 119, 6, 0.25); 
    }

    .dashboard-header { position: relative; z-index: 1000 !important; }
    .dashboard-content-card { position: relative; z-index: 10 !important; }

    input:focus, select:focus, textarea:focus { 
      outline: none !important; 
      box-shadow: 0 0 0 2px rgba(245, 158, 11, 0.4) !important; 
    }

    select { 
      appearance: none; 
      background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23f59e0b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e"); 
      background-repeat: no-repeat; 
      background-position: left 0.75rem center; 
      background-size: 1em; 
    }
    [dir="ltr"] select { background-position: right 0.75rem center; }

    .custom-dropdown { position: relative; user-select: none; z-index: 9999 !important; }
    .custom-dropdown-menu { 
      position: absolute; 
      top: calc(100% + 8px); 
      inset-inline-start: 0; 
      width: 170px;
      opacity: 0; 
      visibility: hidden; 
      transform: translateY(-8px) scale(0.95); 
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); 
      z-index: 99999 !important; 
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
    }
    .custom-dropdown.open .custom-dropdown-menu { 
      opacity: 1; 
      visibility: visible; 
      transform: translateY(0) scale(1); 
    }

    .theme-spin { animation: spinOnce 0.4s cubic-bezier(0.34, 1.56, 0.64, 1); }
    @keyframes spinOnce { 0% { transform: rotate(0deg) scale(0.8); } 100% { transform: rotate(360deg) scale(1); } }

    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #f59e0b; }
  </style>
</head>
<body class="bg-gradient-to-br from-amber-50/60 via-orange-50/40 to-rose-50/50 dark:from-slate-950 dark:via-slate-900 dark:to-slate-950 min-h-screen text-slate-800 dark:text-slate-100 flex flex-col items-center justify-center p-3 sm:p-6 antialiased selection:bg-amber-500 selection:text-white">

  <!-- Canvas Background for Animated Particles -->
  <canvas id="particles-canvas"></canvas>

  <!-- 1. Password Login Screen -->
  <div id="login-screen" class="glass-card max-w-sm w-full p-6 sm:p-8 rounded-3xl border border-amber-500/40 shadow-2xl space-y-5 text-center">
    
    <div class="flex items-center justify-between border-b border-slate-200/50 dark:border-slate-800 pb-3 mb-2">
      <div class="custom-dropdown" id="login-lang-dropdown">
        <button onclick="toggleLangMenu(event, 'login-lang-dropdown')" class="bg-amber-100/80 dark:bg-slate-800/90 border border-amber-300/60 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-[11px] font-semibold py-1 px-2.5 rounded-xl flex items-center gap-1 shadow-sm hover:border-amber-400 active:scale-95">
          <i class="fa-solid fa-globe text-amber-500 text-[10px]"></i>
          <span class="curr-lang-lbl font-bold">العربية</span>
          <i class="fa-solid fa-chevron-down text-[8px] text-amber-500"></i>
        </button>
        <div class="custom-dropdown-menu glass-card bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-1.5 border border-slate-200 dark:border-slate-800">
          <button onclick="changeLanguage('ar')" class="w-full text-start px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-500 hover:text-white flex items-center justify-between transition-colors">العربية <span>🇸🇦</span></button>
          <button onclick="changeLanguage('en')" class="w-full text-start px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-500 hover:text-white flex items-center justify-between transition-colors">English <span>🇬🇧</span></button>
          <button onclick="changeLanguage('fr')" class="w-full text-start px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-500 hover:text-white flex items-center justify-between transition-colors">Français <span>🇫🇷</span></button>
        </div>
      </div>

      <button onclick="toggleDarkMode()" class="w-8 h-8 rounded-xl bg-amber-100/80 dark:bg-slate-800/90 text-slate-700 dark:text-amber-400 border border-amber-300/60 dark:border-slate-700 shadow-sm flex items-center justify-center active:scale-95">
        <i class="theme-icon-el fa-solid fa-moon text-xs"></i>
      </button>
    </div>

    <div class="w-14 h-14 rounded-2xl bg-amber-500/10 text-amber-400 border border-amber-500/30 flex items-center justify-center mx-auto text-2xl">
      <i class="fa-solid fa-user-shield"></i>
    </div>
    <h3 id="login-heading" class="text-xl font-bold text-slate-900 dark:text-white luxury-title">تسجيل دخول الأدمن</h3>
    
    <div class="relative w-full">
      <input type="password" id="login-pass-input" placeholder="Password..." onkeydown="if(event.key === 'Enter') submitAdminLogin()" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-4 py-3 ltr:pr-10 rtl:pl-10 text-sm text-slate-800 dark:text-white text-center">
      <button type="button" onclick="togglePasswordVisibility()" class="absolute inset-y-0 ltr:right-3 rtl:left-3 flex items-center text-slate-400 hover:text-amber-400 text-sm">
        <i id="eye-icon" class="fa-solid fa-eye"></i>
      </button>
    </div>

    <p id="login-err-msg" class="text-xs text-rose-400 hidden font-semibold">كلمة المرور غير صحيحة!</p>
    <button onclick="submitAdminLogin()" id="btn-login-submit" class="w-full bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-3 rounded-xl text-xs shadow-lg shadow-amber-500/20 active:scale-95 transition-transform">دخول لوحة التحكم</button>
  </div>

  <!-- 2. Admin Dashboard Panel (Hidden until login) -->
  <div id="admin-dashboard" class="hidden max-w-5xl mx-auto px-2 sm:px-4 py-4 sm:py-8 w-full space-y-6">
    <div class="dashboard-header flex flex-col sm:flex-row items-center justify-between gap-3 glass-card p-4 rounded-2xl border border-amber-500/30 shadow-md">
      <h3 class="text-base font-black text-amber-500 flex items-center gap-2">
        <i class="fa-solid fa-screwdriver-wrench"></i> <span id="hdr-admin-title">لوحة التحكم (Mazaj Admin)</span>
      </h3>
      
      <div class="flex items-center gap-2 w-full sm:w-auto justify-end">
        <div class="custom-dropdown" id="dash-lang-dropdown">
          <button onclick="toggleLangMenu(event, 'dash-lang-dropdown')" class="bg-amber-100/80 dark:bg-slate-800/90 border border-amber-300/60 dark:border-slate-700 text-slate-900 dark:text-slate-100 text-xs font-semibold py-1.5 px-2.5 rounded-xl flex items-center gap-1 shadow-sm hover:border-amber-400 active:scale-95">
            <i class="fa-solid fa-globe text-amber-500 text-xs"></i>
            <span class="curr-lang-lbl font-bold">العربية</span>
            <i class="fa-solid fa-chevron-down text-[8px] text-amber-500"></i>
          </button>
          <div class="custom-dropdown-menu glass-card bg-white dark:bg-slate-900 rounded-2xl shadow-2xl p-1.5 border border-slate-200 dark:border-slate-800">
            <button onclick="changeLanguage('ar')" class="w-full text-start px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-500 hover:text-white flex items-center justify-between transition-colors">العربية <span>🇸🇦</span></button>
            <button onclick="changeLanguage('en')" class="w-full text-start px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-500 hover:text-white flex items-center justify-between transition-colors">English <span>🇬🇧</span></button>
            <button onclick="changeLanguage('fr')" class="w-full text-start px-3 py-2 rounded-xl text-xs font-semibold hover:bg-amber-500 hover:text-white flex items-center justify-between transition-colors">Français <span>🇫🇷</span></button>
          </div>
        </div>

        <button onclick="toggleDarkMode()" class="w-9 h-9 rounded-xl bg-amber-100/80 dark:bg-slate-800/90 text-slate-700 dark:text-amber-400 border border-amber-300/60 dark:border-slate-700 shadow-sm flex items-center justify-center active:scale-95">
          <i class="theme-icon-el fa-solid fa-moon text-xs"></i>
        </button>

        <a href="index.html" target="_blank" id="btn-view-site" class="text-xs bg-amber-500/20 text-amber-600 dark:text-amber-300 px-3 py-2 rounded-xl border border-amber-500/30 hover:bg-amber-500 hover:text-slate-950 font-semibold flex items-center gap-1 transition-transform active:scale-95">
          <span>عرض الموقع العام</span> ↗
        </a>
      </div>
    </div>

    <div class="dashboard-content-card glass-card p-4 sm:p-6 rounded-3xl shadow-2xl border-2 border-amber-500/40 space-y-6">
      
      <!-- General Store Settings -->
      <div class="space-y-3">
        <h4 id="set-title" class="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-gears text-amber-500"></i> إعدادات المتجر العامة</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <div class="space-y-1"><label id="lbl-phone" class="text-[11px] text-slate-500 dark:text-slate-400">هاتف التوصيل</label><input type="text" id="cfg-phone" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
          <div class="space-y-1"><label id="lbl-address" class="text-[11px] text-slate-500 dark:text-slate-400">اسم العنوان</label><input type="text" id="cfg-address" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
          <div class="space-y-1"><label id="lbl-map" class="text-[11px] text-slate-500 dark:text-slate-400">رابط خريطة جوجل</label><input type="url" id="cfg-map" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
          <div class="space-y-1"><label id="lbl-ig" class="text-[11px] text-slate-500 dark:text-slate-400">رابط انستغرام</label><input type="url" id="cfg-ig" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
          <div class="space-y-1"><label id="lbl-fb" class="text-[11px] text-slate-500 dark:text-slate-400">رابط فيسبوك</label><input type="url" id="cfg-fb" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
          <div class="space-y-1"><label id="lbl-tk" class="text-[11px] text-slate-500 dark:text-slate-400">رابط تيك توك</label><input type="url" id="cfg-tk" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
          <div class="space-y-1">
            <label id="lbl-pwd" class="text-[11px] text-amber-500 font-semibold">Password</label>
            <div class="relative w-full">
              <input type="password" id="cfg-pwd" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 ltr:pr-10 rtl:pl-10 text-xs text-slate-800 dark:text-white" placeholder="Password...">
              <button type="button" onclick="toggleSettingsPasswordVisibility()" class="absolute inset-y-0 ltr:right-3 rtl:left-3 flex items-center text-slate-400 hover:text-amber-400 text-xs">
                <i id="settings-eye-icon" class="fa-solid fa-eye"></i>
              </button>
            </div>
          </div>
        </div>
        <div class="flex justify-start pt-1">
          <button onclick="saveSettings()" id="btn-save-set" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs shadow-md active:scale-95 transition-transform">حفظ الإعدادات</button>
        </div>
      </div>

      <!-- Categories Manager -->
      <div class="border-t border-slate-200 dark:border-slate-700/60 pt-4 space-y-3">
        <h4 id="cat-title" class="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-tags text-amber-500"></i> إدارة الأقسام</h4>
        <div class="flex gap-2">
          <input type="text" id="new-cat-input" placeholder="اسم القسم الجديد..." class="flex-grow bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white">
          <button onclick="addCategory()" id="btn-add-cat" class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-4 py-2 rounded-xl text-xs whitespace-nowrap active:scale-95 transition-transform">إضافة قسم</button>
        </div>
        <div id="admin-cat-manager-list" class="flex flex-wrap gap-2 pt-2"></div>
      </div>

      <!-- Add Product -->
      <div class="border-t border-slate-200 dark:border-slate-700/60 pt-4 space-y-3">
        <h4 id="prod-title" class="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-plus text-amber-500"></i> إضافة منتج جديد</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
          <input type="text" id="p-name" placeholder="اسم المنتج" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white">
          <input type="text" id="p-price" placeholder="السعر (مثال: 400 دج)" class="bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white">
          <select id="p-category" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 pl-8 py-2 text-xs text-slate-800 dark:text-white cursor-pointer"></select>
        </div>
        <div class="space-y-1">
          <label id="lbl-img" class="text-[11px] text-amber-500 font-semibold block">صورة المنتج من الجهاز:</label>
          <label class="flex items-center justify-center gap-2 w-full bg-white dark:bg-slate-900 border border-dashed border-amber-500/40 hover:border-amber-500 rounded-xl py-3 px-4 text-xs text-slate-600 dark:text-slate-300 cursor-pointer transition-colors">
            <i class="fa-solid fa-cloud-arrow-up text-amber-500 text-base"></i>
            <span id="p-file-label">اختر صورة من جهازك...</span>
            <input type="file" id="p-file-input" accept="image/*" class="hidden" onchange="updateFileLabel(this, 'p-file-label')">
          </label>
        </div>
        <textarea id="p-desc" rows="2" placeholder="وصف المنتج..." class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></textarea>
        <button id="btn-add-prod" onclick="addProduct()" class="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold px-4 py-2.5 rounded-xl text-xs flex items-center justify-center gap-2 active:scale-95 transition-transform shadow-lg shadow-emerald-500/10">
          <i class="fa-solid fa-cloud-arrow-up"></i> <span id="btn-add-txt">إضافة المنتج للمتجر</span>
        </button>
      </div>

      <!-- Products List & Quick Edit/Delete -->
      <div class="border-t border-slate-200 dark:border-slate-700/60 pt-4 space-y-3">
        <h4 id="list-title" class="text-sm font-bold text-slate-900 dark:text-slate-100 flex items-center gap-2"><i class="fa-solid fa-box-archive text-amber-500"></i> إدارة وتعديل المنتجات الحالية</h4>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3" id="admin-products-list"></div>
      </div>
    </div>
  </div>

  <!-- Edit Product Modal -->
  <div id="modal-edit-product" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 hidden flex items-center justify-center p-4">
    <div class="glass-card max-w-lg w-full p-6 rounded-3xl border border-amber-500/40 shadow-2xl space-y-4">
      <div class="flex items-center justify-between border-b border-slate-700/60 pb-3">
        <h3 id="edit-mod-title" class="text-base font-bold text-amber-500 flex items-center gap-2"><i class="fa-solid fa-pen-to-square"></i> تعديل بيانات المنتج</h3>
        <button onclick="closeModal('modal-edit-product')" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <input type="hidden" id="edit-p-id">
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
        <div class="space-y-1"><label id="e-lbl-name" class="text-[11px] text-slate-400">اسم المنتج</label><input type="text" id="edit-p-name" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
        <div class="space-y-1"><label id="e-lbl-price" class="text-[11px] text-slate-400">السعر</label><input type="text" id="edit-p-price" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></div>
        <div class="space-y-1 sm:col-span-2"><label id="e-lbl-cat" class="text-[11px] text-slate-400">القسم</label><select id="edit-p-category" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 pl-8 py-2 text-xs text-slate-800 dark:text-white cursor-pointer"></select></div>
      </div>
      <div class="space-y-2 border-t border-b border-slate-200 dark:border-slate-800 py-3">
        <label id="e-lbl-img" class="text-[11px] text-amber-500 font-semibold block">تغيير الصورة:</label>
        <label class="flex items-center justify-center gap-2 w-full bg-white dark:bg-slate-900 border border-dashed border-amber-500/40 hover:border-amber-500 rounded-xl py-3 px-4 text-xs text-slate-600 dark:text-slate-300 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up text-amber-500 text-base"></i>
          <span id="edit-p-file-label">اختر صورة جديدة...</span>
          <input type="file" id="edit-p-file-input" accept="image/*" class="hidden" onchange="updateFileLabel(this, 'edit-p-file-label')">
        </label>
      </div>
      <div class="space-y-1"><label id="e-lbl-desc" class="text-[11px] text-slate-400">الوصف</label><textarea id="edit-p-desc" rows="3" class="w-full bg-white dark:bg-slate-900 border border-slate-300 dark:border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-800 dark:text-white"></textarea></div>
      <div class="flex gap-2 pt-2">
        <button onclick="saveProductEdit()" id="btn-save-edit" class="flex-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold py-2.5 rounded-xl text-xs shadow-md">حفظ التغييرات</button>
        <button onclick="closeModal('modal-edit-product')" id="btn-cancel-edit" class="px-4 bg-slate-800 hover:bg-slate-700 text-slate-300 font-semibold py-2.5 rounded-xl text-xs">إلغاء</button>
      </div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "mouizchettah-git";
    const GITHUB_REPO = "mazaj-store";

    const categoryTranslations = {
      "تحليات وكيك": { ar: "تحليات وكيك", en: "Desserts & Cakes", fr: "Desserts & Gâteaux" },
      "عصائر طبيعية": { ar: "عصائر طبيعية", en: "Fresh Juices", fr: "Jus Naturels" },
      "شاي ومشروبات": { ar: "شاي ومشروبات", en: "Tea & Beverages", fr: "Thé & Boissons" },
      "مكسرات وسكريات": { ar: "مكسرات وسكريات", en: "Nuts & Sweets", fr: "Fruits Secs & Douceurs" }
    };

    function translateCat(catName, lang) {
      return (categoryTranslations[catName] && categoryTranslations[catName][lang]) ? categoryTranslations[catName][lang] : catName;
    }

    const adminI18n = {
      ar: {
        loginHeading: "تسجيل دخول الأدمن",
        loginBtn: "دخول لوحة التحكم",
        loginErr: "كلمة المرور غير صحيحة!",
        hdrTitle: "لوحة التحكم (Mazaj Admin)",
        btnViewSite: "عرض الموقع العام",
        setTitle: "إعدادات المتجر العامة",
        catTitle: "إدارة الأقسام",
        prodTitle: "إضافة منتج جديد",
        listTitle: "إدارة وتعديل المنتجات الحالية",
        saveSet: "حفظ الإعدادات",

    // [تم التعديل بذكاء]: دالة مساعدة لرفع أي تحديثات كملف JSON لمستودع جيت هاب لضمان قراءة التوكن المكتوب في الحقل مباشرة
    async function syncDataToGitHub(filePath, jsonData, successMsg) {
      const tokenToUse = document.getElementById("cfg-pwd").value.trim() || siteSettings.password || "";

      siteSettings.phone = document.getElementById("cfg-phone").value.trim();
      siteSettings.address = document.getElementById("cfg-address").value.trim();
      siteSettings.mapUrl = document.getElementById("cfg-map").value.trim();
      siteSettings.instagram = document.getElementById("cfg-ig").value.trim();
      siteSettings.facebook = document.getElementById("cfg-fb").value.trim();
      siteSettings.tiktok = document.getElementById("cfg-tk").value.trim();
      siteSettings.password = tokenToUse;

      localStorage.setItem("sweety_settings", JSON.stringify(siteSettings));
      localStorage.setItem("sweety_categories", JSON.stringify(categories));
      localStorage.setItem("sweety_products", JSON.stringify(products));

      if (!tokenToUse) {
        alert(successMsg + " (ملاحظة: لم تقم بإدخال الـ Token لذا تم الحفظ محلياً فقط)");
        return;
      }

      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${filePath}`;
      
      try {
        let sha = "";
        const getRes = await fetch(url, {
          headers: { "Authorization": `token ${tokenToUse}` }
        });
        if (getRes.ok) {
          const fileData = await getRes.json();
          sha = fileData.sha;
        }

        const jsonString = JSON.stringify(jsonData, null, 2);
        const base64Content = btoa(unescape(encodeURIComponent(jsonString)));

        const bodyData = {
          message: `Update ${filePath} from Admin Dashboard`,
          content: base64Content
        };
        if (sha) bodyData.sha = sha;

        const putRes = await fetch(url, {
          method: "PUT",
          headers: { "Authorization": `token ${tokenToUse}`, "Content-Type": "application/json" },
          body: JSON.stringify(bodyData)
        });

        if (putRes.ok) {
          alert(successMsg + " وتمت المزامنة السحابية بنجاح 🚀");
        } else {
          const errData = await putRes.json();
          alert("تم الحفظ محلياً، فشلت المزامنة السحابية: " + (errData.message || "تحقق من صحة الـ Token"));
        }
      } catch (err) {
        alert(successMsg + " (تم الحفظ محلياً، خطأ في الاتصال)");
      }
    }

    async function uploadImageToGitHub(file) {
      const tokenToUse = document.getElementById("cfg-pwd").value.trim() || siteSettings.password || "";
      if (!tokenToUse) {
        return new Promise((resolve) => {
          const reader = new FileReader();
          reader.onload = function(e) { resolve(e.target.result); };
          reader.readAsDataURL(file);
        });
      }

      const fileName = `prod_${Date.now()}_${file.name.replace(/[^a-zA-Z0-9.]/g, "_")}`;
      const url = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/assests/${fileName}`;
      const reader = new FileReader();
      return new Promise((resolve) => {
        reader.onload = async function(e) {
          const base64Content = e.target.result.split(',')[1];
          try {
            const res = await fetch(url, {
              method: "PUT",
              headers: { "Authorization": `token ${tokenToUse}`, "Content-Type": "application/json" },
              body: JSON.stringify({ message: `Upload image: ${fileName}`, content: base64Content })
            });
            if (res.ok) {
              const data = await res.json();
              resolve(data.content.download_url || `assests/${fileName}`);
            } else { resolve(e.target.result); }
          } catch (err) { resolve(e.target.result); }
        };
        reader.readAsDataURL(file);
      });
    }

    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    class Particle {
      constructor() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.size = Math.random() * 2 + 0.5;
        this.speedX = Math.random() * 0.4 - 0.2;
        this.speedY = Math.random() * 0.4 - 0.2;
        this.opacity = Math.random() * 0.5 + 0.2;
      }
      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        if (this.x < 0 || this.x > canvas.width) this.speedX *= -1;
        if (this.y < 0 || this.y > canvas.height) this.speedY *= -1;
      }
      draw() {
        ctx.fillStyle = `rgba(245, 158, 11, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function initParticles() {
      particlesArray = [];
      const numberOfParticles = Math.floor((canvas.width * canvas.height) / 18000);
      for (let i = 0; i < numberOfParticles; i++) {
        particlesArray.push(new Particle());
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particlesArray.forEach(p => {
        p.update();
        p.draw();
      });
      requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();
    applyTheme();
    applyAdminLang();

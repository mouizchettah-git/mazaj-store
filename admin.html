<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>لوحة التحكم | مزاج | Admin</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Readex Pro', 'Outfit', sans-serif; }
    h1, h2, h3, .luxury-title { font-family: 'Outfit', 'Readex Pro', sans-serif; letter-spacing: -0.02em; }
    button, a, input, select, textarea, .glass-card {
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col selection:bg-amber-500 selection:text-slate-950">

  <!-- هيدر لوحة التحكم -->
  <header class="w-full bg-slate-900/90 backdrop-blur-md border-b border-slate-800 sticky top-0 z-50 px-4 py-3">
    <div class="max-w-7xl mx-auto flex items-center justify-between">
      <div class="flex items-center gap-2">
        <span class="bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-xl text-xs font-bold">Admin</span>
        <h1 class="text-base sm:text-lg font-black text-slate-100">لوحة تحكم متجر مزاج</h1>
      </div>
      <a href="index.html" class="bg-slate-800 hover:bg-slate-700 text-slate-200 text-xs font-semibold px-3 py-1.5 rounded-xl border border-slate-700 flex items-center gap-1.5">
        <i class="fa-solid fa-store text-amber-500"></i> عودة للمتجر
      </a>
    </div>
  </header>

  <!-- المحتوى الرئيسي للوحة التحكم -->
  <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 py-6 w-full space-y-6">
    
    <!-- إحصائيات سريعة -->
    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
      <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 shadow-xl flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400">إجمالي المنتجات</p>
          <h4 class="text-2xl font-black text-slate-100 mt-1">12</h4>
        </div>
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-lg">
          <i class="fa-solid fa-boxes-stacked"></i>
        </div>
      </div>
      
      <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 shadow-xl flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400">الطلبات النشطة</p>
          <h4 class="text-2xl font-black text-slate-100 mt-1">3</h4>
        </div>
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-lg">
          <i class="fa-solid fa-bag-shopping"></i>
        </div>
      </div>

      <div class="bg-slate-900/80 p-5 rounded-2xl border border-slate-800 shadow-xl flex items-center justify-between">
        <div>
          <p class="text-xs text-slate-400">الأقسام المتاحة</p>
          <h4 class="text-2xl font-black text-slate-100 mt-1">2</h4>
        </div>
        <div class="w-12 h-12 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 text-lg">
          <i class="fa-solid fa-layer-group"></i>
        </div>
      </div>
    </div>

    <!-- نموذج إضافة منتج جديد -->
    <section class="bg-slate-900/80 p-5 sm:p-6 rounded-2xl border border-slate-800 shadow-xl space-y-4">
      <h2 class="text-base sm:text-lg font-bold text-slate-100 flex items-center gap-2">
        <i class="fa-solid fa-circle-plus text-amber-500"></i> إضافة منتج جديد للمتجر
      </h2>
      <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
        <div class="space-y-1">
          <label class="text-xs text-slate-400 font-medium">اسم المنتج</label>
          <input type="text" placeholder="مثال: عصير مانجو طبيعي" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-amber-500">
        </div>
        <div class="space-y-1">
          <label class="text-xs text-slate-400 font-medium">السعر (دج)</label>
          <input type="number" placeholder="400" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-amber-500">
        </div>
        <div class="space-y-1 sm:col-span-2">
          <label class="text-xs text-slate-400 font-medium">رابط الصورة (Image URL)</label>
          <input type="url" placeholder="https://..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-amber-500">
        </div>
        <div class="space-y-1 sm:col-span-2">
          <label class="text-xs text-slate-400 font-medium">وصف المنتج</label>
          <textarea rows="3" placeholder="اكتب وصفاً قصيراً..." class="w-full bg-slate-950 border border-slate-800 rounded-xl px-4 py-2.5 text-xs sm:text-sm text-slate-200 focus:outline-none focus:border-amber-500"></textarea>
        </div>
      </div>
      <button class="bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold px-6 py-2.5 rounded-xl text-xs sm:text-sm shadow-lg shadow-amber-500/20 flex items-center justify-center gap-2 w-full sm:w-auto">
        <i class="fa-solid fa-check"></i> حفظ وإضافة المنتج
      </button>
    </section>

  </main>

  <footer class="bg-slate-900 border-t border-slate-800 py-6 text-center text-xs text-slate-400">
    <p>© 2026 لوحة التحكم - متجر مزاج (Mazaj Biskra)</p>
  </footer>

</body>
</html>
